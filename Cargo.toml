[package]
name = "stack-cli"
version = "0.2.0"
edition = "2024"
rust-version = "1.85"
publish = false
description = "Native command-line interface for Stack diagrams"
repository = "https://github.com/stack-sh/cli"
license = "Apache-2.0"
readme = "README.md"

[[bin]]
name = "stack"
path = "src/main.rs"

[dependencies]
roxmltree = "=0.21.1"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = "=0.11.0"
stack-engine = { git = "https://github.com/stack-sh/engine.git", rev = "b4a85b09f0d75d5966d50dc76b39d7ea4989c823" }
stack-theme = { git = "https://github.com/stack-sh/theme.git", rev = "13e41b84167e810c36c3ab87fff2e1fda84a2b8f" }
zip = { version = "=6.0.0", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[features]
conformance = []

[[test]]
name = "formatter-conformance"
path = "tests/formatter_conformance.rs"
required-features = ["conformance"]

[lints.clippy]
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
unwrap_used = "deny"
