[package]
name = "stack-cli"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
publish = false
description = "Native command-line interface for Stack diagrams"
repository = "https://github.com/stack-sh/cli"
license = "Apache-2.0"
readme = "README.md"

[[bin]]
name = "stack"
path = "src/main.rs"

[dependencies]
roxmltree = "=0.21.1"
serde_json = "=1.0.151"
sha2 = "=0.11.0"
stack-engine = { git = "https://github.com/stack-sh/engine.git", rev = "c82595e33c6f26b67fec7b5c2171921765e30000" }
stack-theme = { git = "https://github.com/stack-sh/theme.git", rev = "2347315e6e86ab9d2708e05fd3f9b5f3d87e1241" }
zip = { version = "=6.0.0", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[features]
conformance = []

[[test]]
name = "formatter-conformance"
path = "tests/formatter_conformance.rs"
required-features = ["conformance"]

[lints.clippy]
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
unwrap_used = "deny"
