[package]
name = "stack-cli"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
publish = false
description = "Native command-line interface for Stack diagrams"
repository = "https://github.com/stack-sh/cli"
license = "Apache-2.0"
readme = "README.md"

[[bin]]
name = "stack"
path = "src/main.rs"

[dependencies]
stack-engine = { git = "https://github.com/stack-sh/engine.git", rev = "e1240661b6d8cebd95ef24207618a62fadb15b48" }

[features]
conformance = []

[[test]]
name = "formatter-conformance"
path = "tests/formatter_conformance.rs"
required-features = ["conformance"]

[lints.clippy]
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
unwrap_used = "deny"
