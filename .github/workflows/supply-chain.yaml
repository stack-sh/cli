name: Supply Chain

on:
  workflow_dispatch:

permissions: {}

jobs:
  keyless-smoke:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Create smoke artifact
        id: fixture
        shell: bash
        run: |
          set -euo pipefail
          artifact=$(node scripts/create-supply-chain-smoke-fixture.mjs target/supply-chain)
          printf 'artifact=%s\n' "$artifact" >> "$GITHUB_OUTPUT"
          printf 'directory=%s\n' "$(dirname "$artifact")" >> "$GITHUB_OUTPUT"
      - name: Install Syft
        id: syft
        uses: anchore/sbom-action/download-syft@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          syft-version: v1.51.1
      - name: Generate SPDX SBOM
        shell: bash
        run: |
          set -euo pipefail
          "${{ steps.syft.outputs.cmd }}" dir:. -o "spdx-json=${{ steps.fixture.outputs.directory }}/smoke.spdx.json"
          jq -e '
            .spdxVersion == "SPDX-2.3" and
            .dataLicense == "CC0-1.0" and
            .SPDXID == "SPDXRef-DOCUMENT" and
            (.packages | type == "array" and length > 0)
          ' "${{ steps.fixture.outputs.directory }}/smoke.spdx.json" > /dev/null
      - name: Attest provenance
        id: provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ steps.fixture.outputs.artifact }}
      - name: Preserve provenance bundle
        shell: bash
        run: |
          set -euo pipefail
          install -m 0644 "${{ steps.provenance.outputs.bundle-path }}" "${{ steps.fixture.outputs.directory }}/smoke.provenance.sigstore.json"
      - name: Attest SBOM
        id: sbom-attestation
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ steps.fixture.outputs.artifact }}
          sbom-path: ${{ steps.fixture.outputs.directory }}/smoke.spdx.json
      - name: Preserve SBOM bundle
        shell: bash
        run: |
          set -euo pipefail
          install -m 0644 "${{ steps.sbom-attestation.outputs.bundle-path }}" "${{ steps.fixture.outputs.directory }}/smoke.sbom.sigstore.json"
      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3
      - name: Generate and sign checksums
        shell: bash
        run: |
          set -euo pipefail
          directory="${{ steps.fixture.outputs.directory }}"
          artifact=$(basename "${{ steps.fixture.outputs.artifact }}")
          (
            cd "$directory"
            sha256sum \
              "$artifact" \
              smoke.provenance.sigstore.json \
              smoke.sbom.sigstore.json \
              smoke.spdx.json \
              | LC_ALL=C sort -k2
          ) > "$directory/smoke-checksums.txt"
          cosign sign-blob \
            --yes \
            --bundle "$directory/smoke-checksums.txt.sigstore.json" \
            "$directory/smoke-checksums.txt"
      - name: Verify signed materials
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          directory="${{ steps.fixture.outputs.directory }}"
          identity="https://github.com/stack-sh/cli/.github/workflows/supply-chain.yaml@refs/heads/main"
          cosign verify-blob \
            --bundle "$directory/smoke-checksums.txt.sigstore.json" \
            --certificate-identity "$identity" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            "$directory/smoke-checksums.txt"
          gh attestation verify "${{ steps.fixture.outputs.artifact }}" \
            --repo stack-sh/cli \
            --bundle "$directory/smoke.provenance.sigstore.json" \
            --signer-workflow stack-sh/cli/.github/workflows/supply-chain.yaml \
            --source-ref refs/heads/main \
            --deny-self-hosted-runners
          gh attestation verify "${{ steps.fixture.outputs.artifact }}" \
            --repo stack-sh/cli \
            --bundle "$directory/smoke.sbom.sigstore.json" \
            --predicate-type https://spdx.dev/Document/v2.3 \
            --signer-workflow stack-sh/cli/.github/workflows/supply-chain.yaml \
            --source-ref refs/heads/main \
            --deny-self-hosted-runners
          (
            cd "$directory"
            sha256sum --check smoke-checksums.txt
          )
      - name: Reject tampered materials
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          directory="${{ steps.fixture.outputs.directory }}"
          artifact="${{ steps.fixture.outputs.artifact }}"
          identity="https://github.com/stack-sh/cli/.github/workflows/supply-chain.yaml@refs/heads/main"
          cp "$artifact" "$RUNNER_TEMP/smoke-artifact.original"
          printf 'tampered\n' >> "$artifact"
          if gh attestation verify "$artifact" \
            --repo stack-sh/cli \
            --bundle "$directory/smoke.provenance.sigstore.json" \
            --signer-workflow stack-sh/cli/.github/workflows/supply-chain.yaml \
            --source-ref refs/heads/main \
            --deny-self-hosted-runners; then
            echo "Expected tampered artifact verification to fail" >&2
            exit 1
          fi
          mv "$RUNNER_TEMP/smoke-artifact.original" "$artifact"
          cp "$directory/smoke-checksums.txt" "$RUNNER_TEMP/smoke-checksums.original"
          printf 'tampered\n' >> "$directory/smoke-checksums.txt"
          if cosign verify-blob \
            --bundle "$directory/smoke-checksums.txt.sigstore.json" \
            --certificate-identity "$identity" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            "$directory/smoke-checksums.txt"; then
            echo "Expected tampered checksum verification to fail" >&2
            exit 1
          fi
          mv "$RUNNER_TEMP/smoke-checksums.original" "$directory/smoke-checksums.txt"
      - name: Upload smoke evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: supply-chain-smoke-${{ github.sha }}
          path: ${{ steps.fixture.outputs.directory }}
          if-no-files-found: error
          retention-days: 7
